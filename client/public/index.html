<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>テクノ⚡ビンゴ</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22><circle%20cx=%2216%22%20cy=%2216%22%20r=%2215%22%20fill=%22%23ffd60a%22/><circle%20cx=%2216%22%20cy=%2216%22%20r=%228%22%20fill=%22%230b0f1a%22/></svg>">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="guest">

<!-- ===== G0 スタート ===== -->
<section id="g0" class="screen on">
  <div class="start">
    <h1 class="tb-logo big"><img src="./logo.svg" alt="テクノ⚡ビンゴ" width="1168" height="378" decoding="async"></h1>
    <h2>りれきの確認</h2>
    <p class="note">出た番号がこの画面に出ます。押す物はありません。手元のビンゴカードと見くらべてください。</p>
    <button id="btn-see" class="btn btn-primary">みる</button>
  </div>
</section>

<!-- ===== G1 履歴 ===== -->
<section id="g1" class="screen">
  <div class="topbar">
    <span class="status"><span id="dot" class="dot"></span><span id="status-text">最終更新 --:--:--</span></span>
    <span class="spacer"></span>
    <span class="status" id="count">0 / 75</span>
  </div>
  <h1 class="tb-logo" id="glogo"><img src="./logo.svg" alt="テクノ⚡ビンゴ" width="1168" height="378" decoding="async"></h1>
  <div class="bignum-wrap" style="flex:0 0 auto;padding:2px 0 2px;">
    <div class="shock" id="shock" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="bignum" class="bignum">--</div>
    <div id="bigletter" class="bigletter"></div>
  </div>
  <div class="gridhead"><span>出た順（新しいものが上）</span><span id="hint">いちばん明るいのが最新です</span></div>
  <div id="grid" class="grid"></div>
</section>

<div id="neongrid" class="neongrid" aria-hidden="true"></div>
<div id="flash" class="flash" aria-hidden="true"><i class="f0"></i><i class="f1"></i><i class="f2"></i><i class="f3"></i></div>

<script src="./app.js"></script>
<script>
(function () {
  "use strict";
  TB.guardGestures();                 // ダブルタップ／ピンチ拡大を止める
  var GID = TB.gameId();
  var MAX = TB.MAX_NUMBER;
  var el = {
    g0: TB.qs("#g0"), g1: TB.qs("#g1"),
    big: TB.qs("#bignum"), letter: TB.qs("#bigletter"),
    grid: TB.qs("#grid"), dot: TB.qs("#dot"),
    status: TB.qs("#status-text"), count: TB.qs("#count"),
    flash: TB.qs("#flash"), grid2: TB.qs("#neongrid"),
    shock: TB.qs("#shock"), logo: TB.qs("#glogo")
  };
  var draws = [], etag = null, lastOk = null, timer = null;
  var prevLen = null;                 // null＝まだ一度も受け取っていない（初回は演出しない）

  /* ============================================================
   * 表示
   * ==========================================================*/
  function render(isNew) {
    var l = draws.length ? draws[draws.length - 1] : null;
    TB.fitBig(el.big, l ? String(l.number) : "--");
    el.letter.textContent = l ? TB.letterOf(l.number) : "";
    el.count.textContent = draws.length + " / " + MAX;

    // 新しいものが上（最新が左上）
    var atTop = el.grid.scrollTop <= 24;
    var html = "";
    for (var i = draws.length - 1; i >= 0; i--) {
      html += '<div class="cell' + (i === draws.length - 1 ? " latest" : "") + '">' + draws[i].number + "</div>";
    }
    el.grid.innerHTML = html;
    if (atTop) el.grid.scrollTop = 0;
    // 新しい 1 枚は上から滑り込み、1.6 秒だけネオンの縁が光る
    if (isNew) {
      var top = el.grid.firstChild;
      if (top) { top.className += TB.reducedMotion() ? "" : " slidein neon"; }
    }
  }

  function setStatus() {
    if (lastOk) {
      var stale = (Date.now() - lastOk.getTime()) > 12000;
      el.dot.className = stale ? "dot off" : "dot";
      el.status.textContent = "最終更新 " + TB.hhmmss(lastOk) + (stale ? "（つながりません）" : "");
    } else {
      el.dot.className = "dot off";
      el.status.textContent = "つながるのを待っています";
    }
  }

  /* ============================================================
   * 確定の演出（v07 で app.js の共通エンジン TB.showFx に集約）
   *   ここは「どの要素を動かすか」を渡すだけ。中身は両画面で同じもの。
   * ==========================================================*/
  function celebrate() {
    TB.showFx({
      big: el.big, flash: el.flash, neongrid: el.grid2,
      shake: el.g1, shock: el.shock, logo: el.logo,
      count: 120,
      origin: function () { return TB.centerOf(el.big); }
    });
  }

  /** 受け取った履歴を反映する。増えた時だけ演出する（取消や初回は出さない） */
  function applyDraws(list) {
    var isNew = (prevLen !== null) && list.length > prevLen;
    draws = list;
    prevLen = list.length;
    render(isNew);
    if (isNew) celebrate();
  }

  /* ============================================================
   * 取得（2 秒ごと・If-None-Match で 304）
   * ==========================================================*/
  /** サーバが無いとき（file:// でのリハ）は同じ端末のホスト画面の控えを読む */
  function localFallback() {
    var s = TB.store.get("tb.host." + GID);
    if (s && s.draws) { lastOk = new Date(); applyDraws(s.draws.slice()); }
    setStatus();
  }

  function poll() {
    if (!TB.apiEnabled) { localFallback(); return; }
    TB.api.state(GID, etag).then(function (r) {
      if (r.ok && r.status === 304) { lastOk = new Date(); setStatus(); return; }
      if (r.ok && r.data && r.data.draws) {
        etag = r.etag || etag;
        lastOk = new Date();
        applyDraws(r.data.draws);
        setStatus();
        return;
      }
      if (r.status === 404) { lastOk = new Date(); applyDraws([]); setStatus(); return; }
      setStatus();                                   // 通信断：最終更新の時刻を出したまま待つ
    });
  }

  /* 画面を暗くさせない（対応端末だけ・失敗は黙って諦める）。
     ビンゴ中に画面が消えると番号を見逃すため。ユーザー操作の中でしか要求できない。 */
  var wakeLock = null;
  function keepAwake() {
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      navigator.wakeLock.request("screen").then(function (w) {
        wakeLock = w;
        w.addEventListener("release", function () { wakeLock = null; });
      })["catch"](function () { /* 非対応・拒否は無視 */ });
    } catch (e) { /* 続行 */ }
  }

  TB.qs("#btn-see").onclick = function () {
    el.g0.classList.remove("on"); el.g1.classList.add("on");
    render(); setStatus(); poll();
    keepAwake();
    if (!timer) timer = setInterval(poll, 1000);     // 1秒ごと（304中心なので軽い）
  };

  TB.bindDrum(el.grid, ".cell");        // 履歴カードを押したらドラムが鳴る

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { poll(); if (!wakeLock) keepAwake(); }   // 前面に戻った瞬間に追いつく
  });
  window.addEventListener("online", poll);
  window.addEventListener("resize", render);
  setInterval(setStatus, 1000);
})();
</script>
</body>
</html>
